name: Daily DSA Email
on:
  schedule:
    - cron: '30 2 * * *'  # 8:00 AM IST daily
  workflow_dispatch: # Allow manual trigger

jobs:
  send-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: '587'
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python -m src.main daily

      - name: Commit state changes
        run: |
          git config user.name "DSA Bot"
          git config user.email "bot@dsa-emailer.local"
          git add data/
          git diff --staged --quiet || git commit -m "📝 Update sent log — $(date +%Y-%m-%d)"
          git push
