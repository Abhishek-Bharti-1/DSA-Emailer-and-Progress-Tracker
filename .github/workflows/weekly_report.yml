name: Weekly DSA Report
on:
  schedule:
    - cron: '30 12 * * 0'  # 6:00 PM IST every Sunday
  workflow_dispatch:

jobs:
  send-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weekly report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: '587'
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python -m src.main weekly

      - name: Commit state changes
        run: |
          git config user.name "DSA Bot"
          git config user.email "bot@dsa-emailer.local"
          git add data/
          git diff --staged --quiet || git commit -m "📊 Weekly report — $(date +%Y-%m-%d)"
          git push
